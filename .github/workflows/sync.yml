name: Game Sync

on:
  repository_dispatch:
    types:
      - cs2-dump-updated
  workflow_dispatch:

permissions:
  contents: write

jobs:
  game-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout s2sdk
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SWIFTLYCHAN_PAT }}

      - name: Checkout CS2-Dumps
        uses: actions/checkout@v5
        with:
          repository: Swiftly-Tracker/CS2-Dumps
          ref: main
          path: CS2-Dumps

      - name: Update protobufs
        run: |
          # only refresh protos we already track; new upstream files are ignored
          for f in protobufs/protos/*.proto; do
            src="CS2-Dumps/protobufs/all/$(basename "$f")"
            if [ -f "$src" ]; then
              cp "$src" "$f"
            else
              echo "::warning::$f missing upstream"
            fi
          done

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain protobufs/protos)" ]; then
            echo "protobufs up to date"
            exit 0
          fi
          git config user.name "swiftlychan"
          git config user.email "swiftlychan@swiftlys2.net"
          git add protobufs/protos
          git commit -m "update(protobufs): sync from CS2-Dumps"
          git push

  libs-sync:
    needs: game-sync
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      APP_ID: "730"
    steps:
      - name: Checkout s2sdk
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SWIFTLYCHAN_PAT }}

      - name: Download SteamDepotDownload
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/Swiftly-Tracker/SteamDepotDownload/releases/latest"
          $url = $release.assets | Where-Object name -eq "SteamDepotDownload-win-x64.zip" | Select-Object -ExpandProperty browser_download_url
          if (-not $url) { throw "Could not resolve SteamDepotDownload release asset" }
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/sdd.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/sdd.zip" -DestinationPath "$env:RUNNER_TEMP/sdd" -Force

      - name: Download tracked files
        run: |
          & "$env:RUNNER_TEMP/sdd/SteamDepotDownload.App.exe" -app $env:APP_ID -filelist tracked_files.json `
            -dir "$env:RUNNER_TEMP/install" -max-downloads 12
          if ($LASTEXITCODE -ne 0) { throw "SteamDepotDownload failed ($LASTEXITCODE)" }

      - name: Update linuxsteamrt64
        run: |
          New-Item -ItemType Directory -Force libs/linuxsteamrt64 | Out-Null
          foreach ($name in "libtier0.so", "libsteam_api.so") {
            $so = "$env:RUNNER_TEMP/install/game/bin/linuxsteamrt64/$name"
            if (-not (Test-Path $so)) { throw "$name was not downloaded" }
            Copy-Item $so "libs/linuxsteamrt64/$name" -Force
          }

      - name: Update win64
        run: |
          $vs =& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item "env:$($Matches[1])" $Matches[2] }
          }

          function Get-Symbols($lib) {
            dumpbin /nologo /linkermember:1 $lib | ForEach-Object {
              if ($_ -match '^\s+[0-9A-Fa-f]+\s+(\S+)\s*$') { $Matches[1] }
            } | Sort-Object
          }

          New-Item -ItemType Directory -Force libs/win64 | Out-Null
          foreach ($name in "tier0", "steam_api64") {
            $dll = "$env:RUNNER_TEMP/install/game/bin/win64/$name.dll"
            if (-not (Test-Path $dll)) { throw "$name.dll was not downloaded" }

            $names = @()
            $inTable = $false
            foreach ($line in (dumpbin /nologo /exports $dll)) {
              if ($line -match '^\s+ordinal\s+hint\s+RVA\s+name') { $inTable = $true; continue }
              if ($line -match '^\s+Summary') { break }
              if (-not $inTable) { continue }
              if ($line -match '^\s+(\d+)\s+[0-9A-Fa-f]+\s+(?:[0-9A-Fa-f]{8}\s+)?(\S+)') {
                if ($Matches[2] -eq '[NONAME]') { $names += "@$($Matches[1]) NONAME" } else { $names += $Matches[2] }
              }
            }
            if ($names.Count -eq 0) { throw "No exports found in $name.dll" }

            # .def and new .lib live in temp; lib.exe timestamps its output, so compare public symbols instead of bytes
            $tmp = Join-Path $env:RUNNER_TEMP "$name-lib"
            New-Item -ItemType Directory -Force $tmp | Out-Null
            $def = (@("LIBRARY $name.dll", "EXPORTS") + ($names | Sort-Object -Unique)) -join "`n"
            [IO.File]::WriteAllText("$tmp/$name.def", "$def`n")
            lib /nologo /machine:x64 /def:"$tmp/$name.def" /out:"$tmp/$name.lib"
            if ($LASTEXITCODE -ne 0) { throw "lib.exe failed for $name ($LASTEXITCODE)" }

            $new = (Get-Symbols "$tmp/$name.lib") -join "`n"
            $old = if (Test-Path "libs/win64/$name.lib") { (Get-Symbols "libs/win64/$name.lib") -join "`n" } else { "" }
            if ($old -ceq $new) {
              Write-Host "$name exports unchanged"
              continue
            }
            Copy-Item "$tmp/$name.lib" "libs/win64/$name.lib" -Force
          }

      - name: Commit and push
        shell: bash
        run: |
          if [ -z "$(git status --porcelain libs)" ]; then
            echo "libs up to date"
            exit 0
          fi
          git config user.name "swiftlychan"
          git config user.email "swiftlychan@swiftlys2.net"
          git add libs
          git commit -m "update(libs): sync tier0 and steam_api from Steam depots"
          git pull --rebase
          git push
